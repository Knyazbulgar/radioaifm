<style>
  :root {
    --bg: oklch(14% 0.01 260);
    --surface: oklch(20% 0.015 260);
    --surface-raised: oklch(25% 0.015 260);
    --border: oklch(32% 0.02 260);
    --text: oklch(92% 0.01 260);
    --muted: oklch(62% 0.015 260);
    --accent: oklch(65% 0.22 30);
    --accent-dim: oklch(55% 0.18 30);
    --live: oklch(60% 0.2 145);
    --success: oklch(62% 0.2 145);
    --warning: oklch(70% 0.18 40);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    color: var(--accent-dim);
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: oklch(14% 0.01 260 / 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 60px;
  }

  .nav-logo {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    font-size: 0.9rem;
    transition: color 0.15s;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--text);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    flex: 1;
  }

  .page-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .page-header h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .page-header .subtitle {
    color: var(--muted);
    font-size: 1rem;
  }

  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
  }

  .chart-section h2 {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Стили вкладок — подхватываются классом .period-tab */
  .period-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .period-tab {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }

  .period-tab:hover {
    color: var(--text);
    background: var(--surface-raised);
  }

  .period-tab.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  .period-range {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.9rem;
  }

  .chart-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .chart-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-radius: 10px;
    transition: background 0.15s;
  }

  .chart-item:hover {
    background: var(--surface-raised);
  }

  .rank {
    font-size: 1.4rem;
    font-weight: 800;
    width: 50px;
    text-align: center;
    color: var(--muted);
    flex-shrink: 0;
  }

  .rank.top-1 {
    color: oklch(75% 0.15 60);
    font-size: 1.8rem;
  }

  .rank.top-2 {
    color: oklch(70% 0.12 40);
    font-size: 1.6rem;
  }

  .rank.top-3 {
    color: oklch(65% 0.10 30);
    font-size: 1.5rem;
  }

  .chart-song {
    flex: 1;
    min-width: 0;
  }

  .chart-title {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.15rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chart-artist {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .votes {
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .loading {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }

  .empty-state-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 2rem 1.5rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: auto;
  }

  footer a {
    color: var(--accent);
  }

  @media (max-width: 640px) {
    nav {
      padding: 0 1rem;
    }

    .nav-links {
      display: none;
    }

    .rank {
      width: 40px;
      font-size: 1.2rem;
    }

    .rank.top-1 {
      font-size: 1.5rem;
    }

    .rank.top-2 {
      font-size: 1.4rem;
    }

    .rank.top-3 {
      font-size: 1.3rem;
    }

    .chart-section {
      padding: 1.25rem;
    }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">📡 Radio AI FM</a>
  <ul class="nav-links">
    <li><a href="/#schedule">Расписание</a></li>
    <li><a href="/#news">Новости</a></li>
    <li><a href="/#team">Ведущие</a></li>
    <li><a href="/#contacts">Контакты</a></li>
    <li><a href="/hitparad.html" class="active">Хит-парад</a></li>
  </ul>
</nav>

<div class="container">
  <header class="page-header">
    <h1>🏆 ХИТ-ПАРАД AIFM</h1>
    <p class="subtitle">Топ-20 треков по голосам слушателей — за неделю, прошлую неделю, месяц и год</p>
  </header>

  <section class="chart-section">
    <h2>🎵 Топ-20 треков</h2>

    <div class="period-tabs" id="chart-tabs" role="tablist" aria-label="Период хит-парада"></div>
    <div class="period-range" id="chart-range"></div>

    <div class="chart-list" id="chart-list">
      <div class="loading">Загрузка рейтинга...</div>
    </div>
  </section>
</div>

<footer>
  <p>© 2025 Radio AI FM · <a href="/">На главную</a> · <a href="/#contacts">Контакты</a></p>
</footer>

<script>
const API_URL = 'https://aifm-vote.pesnibulgara.workers.dev';
const REFRESH_MS = 60000;

/* Неделя считается с субботы 00:00 по московскому времени.
   «Текущая неделя» — та, что идёт сейчас; «прошлая неделя» — закрытая,
   её и объявляют в субботнем выпуске. */
const TABS = [
  { key: 'week',      label: 'Текущая неделя' },
  { key: 'last_week', label: 'Прошлая неделя' },
  { key: 'month',     label: 'Месяц' },
  { key: 'year',      label: 'Год' },
];

let currentPeriod = 'week';
let allData = null;
let loading = false;

/* ------------------------------- вкладки ------------------------------- */

function renderTabs() {
  const box = document.getElementById('chart-tabs');
  box.innerHTML = TABS.map(t => {
    const active = t.key === currentPeriod;
    return `<button class="period-tab${active ? ' active' : ''}" role="tab"
              aria-selected="${active ? 'true' : 'false'}"
              data-period="${t.key}">${t.label}</button>`;
  }).join('');

  box.querySelectorAll('.period-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const period = btn.dataset.period;
      if (period === currentPeriod) return;
      currentPeriod = period;
      renderTabs();
      renderChart();
    });
  });
}

/* -------------------------------- список -------------------------------- */

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : text;
  return div.innerHTML;
}

function pluralize(count) {
  const mod10 = count % 10;
  const mod100 = count % 100;
  if (mod10 === 1 && mod100 !== 11) return 'голос';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'голоса';
  return 'голосов';
}

function renderChart() {
  const chartList = document.getElementById('chart-list');
  const rangeEl = document.getElementById('chart-range');
  if (!allData) return;

  const songs = allData[currentPeriod] || [];
  const range = (allData.ranges[currentPeriod] || {}).label || '';
  rangeEl.textContent = range;

  if (!songs.length) {
    chartList.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🎵</div>
        <p>Пока нет проголосованных треков за этот период</p>
        <p style="margin-top:0.5rem;font-size:0.85rem;">Станьте первым, кто проголосует на <a href="/">главной странице</a>!</p>
      </div>
    `;
    return;
  }

  chartList.innerHTML = songs.map((song, index) => {
    const rank = index + 1;
    let rankClass = '';
    if (rank === 1) rankClass = 'top-1';
    else if (rank === 2) rankClass = 'top-2';
    else if (rank === 3) rankClass = 'top-3';

    return `
      <div class="chart-item">
        <div class="rank ${rankClass}">${rank}</div>
        <div class="chart-song">
          <div class="chart-title">${escapeHtml(song.title)}</div>
          <div class="chart-artist">${escapeHtml(song.artist)}</div>
        </div>
        <div class="votes">${song.votes} ${pluralize(song.votes)}</div>
      </div>
    `;
  }).join('');
}

/* ------------------------------- загрузка ------------------------------- */

async function loadChart() {
  if (loading) return;
  loading = true;

  try {
    const res = await fetch(`${API_URL}/chart`);
    const data = await res.json();

    allData = {
      week:      data.week || [],
      last_week: data.last_week || [],
      month:     data.month || [],
      year:      data.year || [],
      ranges:    data.ranges || {},
    };

    renderChart();
  } catch (err) {
    console.error('Ошибка загрузки рейтинга:', err);
    document.getElementById('chart-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <p>Не удалось загрузить рейтинг</p>
      </div>
    `;
  } finally {
    loading = false;
  }
}

renderTabs();
loadChart();
setInterval(loadChart, REFRESH_MS);
</script>

</body>
