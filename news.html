<style>
  :root {
    --bg: oklch(14% 0.01 260);
    --surface: oklch(20% 0.015 260);
    --surface-raised: oklch(25% 0.015 260);
    --border: oklch(32% 0.02 260);
    --text: oklch(92% 0.01 260);
    --muted: oklch(62% 0.015 260);
    --accent: oklch(65% 0.22 30);
    --accent-dim: oklch(55% 0.18 30);
    --live: oklch(60% 0.2 145);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-dim); }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: oklch(14% 0.01 260 / 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 60px;
  }
  .nav-logo { font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; }
  .nav-links a { color: var(--muted); font-size: 0.9rem; transition: color 0.15s; }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--text); font-weight: 600; }

  main { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  .page-title { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
  .page-sub { color: var(--muted); margin: 0.4rem 0 2.5rem; font-size: 1rem; }

  .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .news-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem;
  }
  .news-tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .news-date { font-size: 0.75rem; color: var(--muted); }
  .news-card h3 { font-size: 1rem; }
  .news-card p { font-size: 0.875rem; color: var(--muted); }

  .is-new { border-color: oklch(65% 0.22 30 / 0.5); }
  .badge-new {
    align-self: flex-start;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
    background: var(--accent); color: oklch(14% 0.01 260);
    padding: 0.1rem 0.5rem; border-radius: 99px;
  }

  .news-empty {
    color: var(--muted); text-align: center; padding: 2.5rem 1rem;
    border: 1px dashed var(--border); border-radius: 12px; grid-column: 1 / -1;
  }
  .back { display: inline-block; margin-top: 2.5rem; font-size: 0.9rem; }

  footer {
    border-top: 1px solid var(--border);
    padding: 2.5rem 1.5rem; text-align: center;
    font-size: 0.85rem; color: var(--muted);
  }

  @media (max-width: 640px) {
    nav { padding: 0 1rem; }
    .nav-links { display: none; }
  }
</style>

<main>
  <h1 class="page-title">Новости</h1>

<script>
/* Отдельная страница новостей.
   Данные — в news.json, порядок задаётся полем date (ДД.ММ.ГГГГ). */
(function () {
  "use strict";
  const NEWS_URL = "./news.json";
  const FRESH_DAYS = 14;   // сколько дней считать новость свежей и помечать

  function toOrdinal(s) {
    const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s || "").trim());
    if (!m) return 0;
    const d = +m[1], mo = +m[2], y = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return 0;
    return Date.UTC(y, mo - 1, d);
  }

  function isFresh(n) {
    const t = toOrdinal(n.date);
    if (!t) return false;
    const now = Date.now();
    return now >= t && (now - t) <= FRESH_DAYS * 86400000;
  }

  function card(n) {
    const el = document.createElement("article");
    el.className = "news-card" + (isFresh(n) ? " is-new" : "");

    const top = document.createElement("div");
    top.style.display = "flex";
    top.style.alignItems = "center";
    top.style.gap = "0.6rem";
    top.style.flexWrap = "wrap";

    const tag = document.createElement("span");
    tag.className = "news-tag";
    tag.textContent = n.tag || "";
    top.appendChild(tag);

    if (isFresh(n)) {
      const b = document.createElement("span");
      b.className = "badge-new";
      b.textContent = "НОВОЕ";
      top.appendChild(b);
    }

    const date = document.createElement("time");
    date.className = "news-date";
    date.textContent = n.date || "";

    const h3 = document.createElement("h3");
    h3.textContent = n.title || "";

    const p = document.createElement("p");
    p.textContent = n.text || "";

    el.appendChild(top);
    el.appendChild(date);
    el.appendChild(h3);
    el.appendChild(p);
    return el;
  }

  function empty(text) {
    const el = document.createElement("div");
    el.className = "news-empty";
    el.textContent = text;
    return el;
  }

  const grid = document.getElementById("newsGrid");
  if (!grid) return;

  fetch(NEWS_URL, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (items) {
      if (!Array.isArray(items)) throw new Error("news.json должен содержать массив");
      grid.innerHTML = "";
      if (!items.length) { grid.appendChild(empty("Новостей пока нет.")); return; }
      items
        .slice()
        .sort(function (a, b) { return toOrdinal(b.date) - toOrdinal(a.date); })
        .forEach(function (n) { grid.appendChild(card(n)); });
    })
    .catch(function (e) {
      grid.innerHTML = "";
      grid.appendChild(empty("Не удалось загрузить новости: " + e.message));
    });
})();
</script>
